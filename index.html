<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spear Consulting</title>
<meta name="description" content="Spear Consulting | رمح للاستشارات. Financial models, feasibility studies, pricing and brand identity. Precision before execution.">
</head>
<body>
<title>Spear Website</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Manrope:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap">
<style>
/* Layout: light-first product page, 1200px column on a faint four-column hairline grid; the deliverable is the "product shot" */
:root{
  --bg:#F4F1EC;--raised:#FBFAF7;--sunken:#EAE5DD;--ink:#0E0E0D;--muted:#5C5852;--line:#DAD4CA;--strong:#837D73;--up:#1F5F46;
  --panel:#0E0E0D;--onpanel:#F4F1EC;--onpanel2:#A8A39A;--btnbg:#0E0E0D;--btnfg:#F4F1EC;--glow:rgba(14,14,13,.07);
  --display:"Spear Bodoni","Bodoni Moda",Didot,"Bodoni 72",Georgia,serif;--sans:Manrope,"Helvetica Neue",Arial,sans-serif;
  --ar:"IBM Plex Sans Arabic","Geeza Pro",Tahoma,sans-serif;
  --gut:max(clamp(20px,4vw,48px),env(safe-area-inset-left,0px));--gutr:max(clamp(20px,4vw,48px),env(safe-area-inset-right,0px));
  --ease:cubic-bezier(.2,.7,.1,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F0F0E;--raised:#1A1918;--sunken:#080807;--ink:#F1EEE8;--muted:#A8A39A;--line:#2E2C29;--strong:#77726A;--up:#7FC2A0;--panel:#080807;--onpanel:#F1EEE8;--onpanel2:#A8A39A;--btnbg:#F1EEE8;--btnfg:#0F0F0E;--glow:rgba(241,238,232,.06);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F0F0E;--raised:#1A1918;--sunken:#080807;--ink:#F1EEE8;--muted:#A8A39A;--line:#2E2C29;--strong:#77726A;--up:#7FC2A0;--panel:#080807;--onpanel:#F1EEE8;--onpanel2:#A8A39A;--btnbg:#F1EEE8;--btnfg:#0F0F0E;--glow:rgba(241,238,232,.06);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;transition:background .35s,color .35s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
#app[dir=rtl]{font-family:var(--ar)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--strong);outline-offset:3px}
.wrap{max-width:1296px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gutr);position:relative}
.svg svg{display:block;height:100%;width:auto}

/* nav */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid transparent;transition:border-color .3s,background .35s}
nav.scrolled{border-bottom-color:var(--line)}
nav .wrap{height:68px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{height:30px;color:var(--ink)}
#app[dir=rtl] .logo{height:26px}
.links{display:flex;gap:28px;font:500 14px var(--sans);color:var(--muted)}
#app[dir=rtl] .links{font:500 15px var(--ar)}
.links a{text-decoration:none;transition:color .2s}.links a:hover{color:var(--ink)}
.right{display:flex;align-items:center;gap:10px}
.chip{height:36px;min-width:36px;padding:0 12px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font:500 13px var(--sans);color:var(--muted);transition:color .2s,border-color .2s}
.chip:hover{color:var(--ink);border-color:var(--strong)}
.chip.lang-ar{font:500 14px var(--ar)}
.btn{display:inline-flex;align-items:center;gap:10px;height:42px;padding:0 18px;background:var(--btnbg);color:var(--btnfg);border:1px solid var(--btnbg);font:500 14px var(--sans);text-decoration:none;transition:background .2s,color .2s}
#app[dir=rtl] .btn{font:500 15px var(--ar)}
.btn:hover{background:transparent;color:var(--ink)}
.btn .arr{font-family:var(--sans);transition:transform .25s var(--ease)}
.btn:hover .arr{transform:translateX(4px)}
#app[dir=rtl] .btn:hover .arr{transform:translateX(-4px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.label{display:inline-flex;align-items:center;gap:10px;font:500 13px var(--sans);color:var(--muted)}
#app[dir=rtl] .label{font:500 14px var(--ar)}
.label i{width:6px;height:6px;background:var(--ink);display:inline-block}

/* hero */
header{position:relative;border-bottom:1px solid var(--line);overflow:hidden}
.grid-bg{position:absolute;top:0;bottom:0;left:var(--gut);right:var(--gutr);pointer-events:none;background:linear-gradient(to right,var(--line) 1px,transparent 1px) 0 0/25% 100%;opacity:.6}
.hero-in{position:relative;padding-block:96px 88px}
h1{font:500 clamp(52px,8.4vw,100px)/1 var(--display);letter-spacing:-.025em;margin:24px 0 0;text-wrap:balance}
#app[dir=rtl] h1{font:500 clamp(48px,7.6vw,88px)/1.3 var(--ar);letter-spacing:0}
.line{display:block;overflow:hidden;padding-bottom:.06em}
.line>span{display:block}
.sub{font:400 clamp(17px,1.6vw,20px)/1.55 var(--sans);color:var(--muted);max-width:560px;margin:24px 0 0}
#app[dir=rtl] .sub{font:400 clamp(18px,1.7vw,21px)/1.8 var(--ar)}
.ctas{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}

/* product window */
.win{position:relative;border:1px solid var(--line);background:var(--raised)}
.win.spot::after{content:"";position:absolute;inset:-1px;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),var(--glow),transparent 60%)}
.win.spot:hover::after{opacity:1}
.bar{height:40px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px}
.bar b{width:9px;height:9px;border:1px solid var(--strong);flex:none}
.tabs{display:flex;gap:4px;margin-inline-start:16px}
.tab{font:500 12px var(--sans);color:var(--muted);padding:4px 10px;transition:background .2s,color .2s}
#app[dir=rtl] .tab{font:500 13px var(--ar)}
.tab.on{color:var(--ink);background:var(--sunken)}
button.tab{position:relative;overflow:hidden}
button.tab:hover{color:var(--ink)}
button.tab .tp{position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--ink);transform-origin:left;transform:scaleX(0)}
#app[dir=rtl] button.tab .tp{transform-origin:right}
button.tab.on.auto .tp{animation:tp 6s linear forwards}
#hero-win:hover button.tab.on.auto .tp{animation-play-state:paused}
@keyframes tp{to{transform:scaleX(1)}}
.pane{animation:paneIn .5s var(--ease) both}
@keyframes paneIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.feas{display:grid;grid-template-columns:1fr 1.25fr}
.feas .vcard{padding:22px 20px;border-inline-end:1px solid var(--line);min-width:0}
.frow{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;padding:12px 20px;border-top:1px solid var(--line);font:400 13px var(--sans)}
#app[dir=rtl] .frow{font:400 14px var(--ar)}
.frow:first-child{border-top:0}
.frow b{font-weight:500;text-align:end}
.pane .tick svg{stroke-dashoffset:20}
.pane.live .tick svg{stroke-dashoffset:0}
@media (max-width:640px){.feas{grid-template-columns:1fr}.feas .vcard{border-inline-end:0;border-bottom:1px solid var(--line)}}
.file{margin-inline-start:auto;font:400 12px var(--sans);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#app[dir=rtl] .file{font-family:var(--ar)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.kpi{padding:18px 20px;border-inline-end:1px solid var(--line);min-width:0}
.kpi:last-child{border-inline-end:0}
.k{font:500 12px var(--sans);color:var(--muted)}
#app[dir=rtl] .k{font:400 13px var(--ar)}
.v{font:400 clamp(24px,2.6vw,34px)/1.1 var(--display);margin-top:10px;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
#app[dir=rtl] .v{font:500 clamp(22px,2.4vw,30px)/1.3 var(--ar)}
.v.go{color:var(--up)}
.split{display:grid;grid-template-columns:1fr 1.25fr}
.chart{padding:22px 20px;border-inline-end:1px solid var(--line);min-width:0}
.bars{display:flex;gap:14px;height:180px;align-items:flex-end;border-bottom:1px solid var(--strong);direction:ltr}
.pair{flex:1;display:flex;gap:4px;align-items:flex-end;height:100%}
.pair i{flex:1;display:block;transform-origin:bottom;background:var(--ink)}
.pair i.c{background:var(--strong);opacity:.6}
.years{display:flex;justify-content:space-between;margin-top:8px;font:400 11px var(--sans);color:var(--muted);direction:ltr;font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;padding:9px 20px;border-top:1px solid var(--line);font:400 13px var(--sans)}
#app[dir=rtl] .row{font:400 14px var(--ar)}
.row.h{border-top:0;color:var(--muted);font-size:12px}
.row span:not(:first-child){text-align:end;font-family:var(--sans);font-variant-numeric:tabular-nums}
.row.b{font-weight:600}
.verdict{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;font:500 13px var(--sans)}
#app[dir=rtl] .verdict{font-family:var(--ar)}
.dot{width:8px;height:8px;background:var(--up);position:relative}
.dot::after{content:"";position:absolute;inset:-4px;border:1px solid var(--up);opacity:0}
.win.live .dot::after{animation:ping 1.6s var(--ease) 1.4s 2}
@keyframes ping{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(2.2)}}

/* logo band */
.trusted{padding-block:56px}
.marquee{position:relative;overflow:hidden;direction:ltr;margin-top:24px;-webkit-mask-image:linear-gradient(to right,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(to right,transparent,#000 10%,#000 90%,transparent)}
.track{display:flex;width:max-content;animation:roll 38s linear infinite}
.marquee:hover .track{animation-play-state:paused}
#app[dir=rtl] .track{animation-direction:reverse}
@keyframes roll{to{transform:translateX(-50%)}}
.brand{display:inline-flex;align-items:center;gap:14px;padding:0 44px;font:500 15px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);white-space:nowrap;border-inline-end:1px solid var(--line);transition:color .2s}
.brand:hover{color:var(--ink)}
.lg{display:inline-block;height:34px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.brand .lg{color:var(--ink)}

/* features */
.feat{display:grid;grid-template-columns:1fr 1.15fr;gap:64px;align-items:center;padding-block:96px;border-top:1px solid var(--line)}
.feat.flip{grid-template-columns:1.15fr 1fr}
.feat>*{min-width:0}
h2{font:500 clamp(36px,4.6vw,54px)/1.06 var(--display);letter-spacing:-.02em;margin:18px 0 0;text-wrap:balance}
#app[dir=rtl] h2{font:500 clamp(32px,4vw,48px)/1.4 var(--ar);letter-spacing:0}
.p{font:400 17px/1.6 var(--sans);color:var(--muted);margin:18px 0 0;max-width:470px}
#app[dir=rtl] .p{font:400 18px/1.8 var(--ar)}
.mini{display:flex;justify-content:space-between;gap:12px}
.mini .v{font-size:clamp(22px,2.2vw,30px)}
.mbars{display:flex;gap:10px;height:120px;align-items:flex-end;margin-top:26px;border-bottom:1px solid var(--strong);direction:ltr}
.mbars i{flex:1;display:block;transform-origin:bottom;background:var(--strong);opacity:.55}
.mbars i.k2{background:var(--ink);opacity:1}
.vbig{font:500 clamp(30px,3.4vw,42px)/1.2 var(--display);margin-top:14px}
#app[dir=rtl] .vbig{font:500 clamp(28px,3vw,38px)/1.4 var(--ar)}
.cond{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font:400 15px var(--sans)}
#app[dir=rtl] .cond{font-family:var(--ar)}
.cond:first-of-type{margin-top:18px}
.tick{width:18px;height:18px;border:1px solid var(--strong);display:inline-grid;place-items:center;flex:none}
.tick svg{width:12px;height:12px;stroke:var(--ink);stroke-width:1.8;fill:none;stroke-dasharray:20;stroke-dashoffset:0;transition:stroke-dashoffset .5s var(--ease)}
.prow{display:grid;grid-template-columns:1.4fr .7fr .7fr 1.2fr;align-items:center;gap:8px;padding:14px 20px;border-top:1px solid var(--line);font:400 14px var(--sans)}
#app[dir=rtl] .prow{font-family:var(--ar)}
.prow.h{border-top:0;color:var(--muted);font-size:12px}
.prow span:not(:first-child){text-align:end;font-family:var(--sans);font-variant-numeric:tabular-nums}
.meter{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.meter s{display:block;height:4px;width:70px;background:var(--sunken);position:relative;text-decoration:none}
.meter s::after{content:"";position:absolute;inset:0;background:var(--up);transform-origin:left;transform:scaleX(var(--w,0));transition:transform .9s var(--ease)}
#app[dir=rtl] .meter s::after{transform-origin:right}
.meter b{font-weight:500;color:var(--up);min-width:36px;text-align:end}

/* work */
.sect{padding-block:96px;border-top:1px solid var(--line)}
.wrow{display:grid;grid-template-columns:64px minmax(180px,260px) 1fr 24px;gap:24px;align-items:center;padding:22px 0;border-top:1px solid var(--line);position:relative;transition:padding .3s var(--ease)}
.wrow::before{content:"";position:absolute;inset:0 calc(-1 * 16px);background:var(--raised);opacity:0;transition:opacity .25s;z-index:-1}
.wrow:hover::before{opacity:1}
.wrow:last-child{border-bottom:1px solid var(--line)}
.tile{width:56px;height:56px;border:1px solid var(--line);background:var(--raised);display:grid;place-items:center;transition:background .25s,border-color .25s}
.tile .lg{height:32px;width:32px;color:var(--ink);transition:color .25s}
.wrow:hover .tile{background:var(--ink);border-color:var(--ink)}
.wrow:hover .tile .lg{color:var(--bg)}
.wname{font:500 22px/1.25 var(--display)}
.wname.ar{font:500 21px/1.4 var(--ar)}
.wtag{font:500 12px var(--sans);color:var(--muted);margin-top:6px}
#app[dir=rtl] .wtag{font:500 13px var(--ar)}
.wrow .p{margin:0;max-width:none;font-size:16px}
.go{font-family:var(--sans);color:var(--muted);transition:transform .3s var(--ease),color .2s}
.wrow:hover .go{transform:translateX(6px);color:var(--ink)}
#app[dir=rtl] .wrow:hover .go{transform:translateX(-6px)}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);position:relative;margin-top:48px}
.steps::before{content:"";position:absolute;top:0;inset-inline:0;height:1px;background:var(--line)}
.progress{position:absolute;top:0;inset-inline-start:0;height:1px;width:100%;background:var(--ink);transform-origin:left;transform:scaleX(var(--p,1));transition:transform 1.6s var(--ease)}
#app[dir=rtl] .progress{transform-origin:right}
.step{padding:28px 24px 0 0;padding-inline-start:24px;padding-inline-end:24px;border-inline-start:1px solid var(--line)}
.step:first-of-type{border-inline-start:0;padding-inline-start:0}
.sn{font:500 13px var(--sans);color:var(--muted);transition:color .4s}
.step.lit .sn{color:var(--ink)}
.st{font:600 19px var(--sans);margin-top:14px}
#app[dir=rtl] .st{font:500 21px var(--ar)}
.step .p{font-size:15px;margin-top:8px}

/* motto band */
.band{position:relative;overflow:hidden;background:var(--panel);color:var(--onpanel);height:clamp(220px,26vw,320px);border-block:1px solid var(--line)}
.band .spear{position:absolute;top:50%;height:clamp(28px,3vw,42px);left:0;transform:translate(var(--sx,-30%),-50%);color:var(--onpanel);will-change:transform}
.band .wrap{height:100%;display:flex;align-items:center;justify-content:flex-end}
.motto{font:italic 400 clamp(36px,5vw,64px)/1.1 var(--display);text-align:end}
#app[dir=rtl] .motto{font:500 clamp(36px,5vw,64px)/1.35 var(--ar)}
#app[dir=rtl] .band .wrap{justify-content:flex-start}

/* cta + footer */
.cta{padding-block:110px;text-align:center}
.cta h2{margin:0}
.cta .p{margin:18px auto 0;max-width:520px}
.cta .ctas{justify-content:center}
.mail{user-select:all}
footer{border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:28px;flex-wrap:wrap}
.copy{font:400 13px var(--sans);color:var(--muted)}
#app[dir=rtl] .copy{font-family:var(--ar)}
.seg{display:inline-flex;border:1px solid var(--line)}
.seg button{font:500 12px var(--sans);color:var(--muted);padding:6px 12px;transition:background .2s,color .2s}
#app[dir=rtl] .seg button{font:500 13px var(--ar)}
.seg button[aria-pressed=true]{background:var(--sunken);color:var(--ink)}

/* motion */
.in-load .rise{animation:rise .9s var(--ease) both}
.in-load .line>span{animation:lineup 1s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes lineup{from{transform:translateY(105%)}to{transform:none}}
.grow i{animation:grow 1s var(--ease) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
.pending{opacity:0;transform:translateY(24px)}
.revealed{opacity:1;transform:none;transition:opacity .8s var(--ease),transform .8s var(--ease)}
.pending .tick svg{stroke-dashoffset:20}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.pending{opacity:1;transform:none}.track{animation:none}}

/* responsive */

/* multi-page additions */
.links a.on{color:var(--ink)}
.links a{position:relative}
.links a.on::after{content:"";position:absolute;left:0;right:0;bottom:-24px;height:1px;background:var(--ink)}
main{animation:pageIn .55s var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.phead{position:relative;border-bottom:1px solid var(--line);overflow:hidden}
.phead .hero-in{padding-block:88px 72px}
.phead h1{font-size:clamp(44px,6.6vw,84px)}
#app[dir=rtl] .phead h1{font-size:clamp(40px,6vw,76px)}
.crumb{display:flex;gap:8px;font:500 13px var(--sans);color:var(--muted)}
#app[dir=rtl] .crumb{font:500 14px var(--ar)}
.crumb a{text-decoration:none}.crumb a:hover{color:var(--ink)}
.teaser{display:grid;grid-template-columns:90px 1fr 1.2fr 140px 24px;gap:24px;align-items:center;padding:26px 0;border-top:1px solid var(--line);text-decoration:none;position:relative}
.teaser:last-child{border-bottom:1px solid var(--line)}
.teaser::before{content:"";position:absolute;inset:0 -16px;background:var(--raised);opacity:0;transition:opacity .25s;z-index:-1}
.teaser:hover::before{opacity:1}
.teaser:hover .go{transform:translateX(6px);color:var(--ink)}
#app[dir=rtl] .teaser:hover .go{transform:translateX(-6px)}
.tnum{font:400 28px var(--display);color:var(--muted)}
.tname{font:500 clamp(26px,2.6vw,34px)/1.15 var(--display)}
#app[dir=rtl] .tname{font:500 clamp(24px,2.4vw,30px)/1.4 var(--ar)}
.ttime{font:500 13px var(--sans);color:var(--muted);text-align:end}
#app[dir=rtl] .ttime{font-family:var(--ar)}
.more{display:inline-flex;gap:8px;margin-top:28px;font:500 14px var(--sans);text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:3px}
#app[dir=rtl] .more{font:500 15px var(--ar)}
.svc{padding-block:96px;border-top:1px solid var(--line)}
.svc:first-child{border-top:0}
.svc-top{display:grid;grid-template-columns:1fr 1.15fr;gap:64px;align-items:center}
.svc-top>*{min-width:0}
.svc-det{display:grid;grid-template-columns:1fr 1.15fr;gap:64px;margin-top:56px}
.dl{font:500 13px var(--sans);color:var(--muted);margin-bottom:10px}
#app[dir=rtl] .dl{font:500 14px var(--ar)}
.get{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.get li{display:flex;gap:14px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line);font:400 16px/1.5 var(--sans)}
#app[dir=rtl] .get li{font:400 17px/1.6 var(--ar)}
.get li::before{content:"";width:6px;height:6px;background:var(--ink);flex:none;transform:translateY(-2px)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div{padding:18px 0;border-inline-start:1px solid var(--line);padding-inline-start:20px}
.facts div:first-child{border-inline-start:0;padding-inline-start:0}
.facts b{display:block;font:400 26px/1.2 var(--display);margin-top:6px}
#app[dir=rtl] .facts b{font:500 22px/1.4 var(--ar)}
.promise{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.promise div{padding:28px 24px 0 0;padding-inline-start:24px;border-inline-start:1px solid var(--line)}
.promise div:first-child{border-inline-start:0;padding-inline-start:0}
.promise .st{font-size:18px}
.bigstep{display:grid;grid-template-columns:120px 1fr 1.2fr;gap:32px;padding:44px 0;border-top:1px solid var(--line);align-items:start}
.bigstep .num{font:400 56px/1 var(--display);color:var(--muted)}
.bigstep h3{font:500 34px/1.15 var(--display);margin:0}
#app[dir=rtl] .bigstep h3{font:500 30px/1.4 var(--ar)}
.about{display:grid;grid-template-columns:.8fr 1.2fr;gap:64px;align-items:start}
.portrait{position:relative;aspect-ratio:4/5;max-width:100%;background:var(--panel);overflow:hidden}
.portrait .vs{position:absolute;left:50%;top:14%;height:120%;transform:translateX(-50%);color:var(--onpanel)}
.portrait .ph{position:absolute;left:20px;right:20px;bottom:20px;font:400 12px var(--sans);color:var(--onpanel2)}
#app[dir=rtl] .portrait .ph{font-family:var(--ar)}
.bio{font:400 clamp(19px,1.8vw,23px)/1.6 var(--sans);margin:0}
#app[dir=rtl] .bio{font:400 clamp(20px,1.9vw,24px)/1.85 var(--ar)}
/* booking */
.book{display:grid;grid-template-columns:1.3fr .7fr;gap:64px;align-items:start}
.book>*{min-width:0}
form{display:grid;gap:22px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fld label{display:block;font:500 13px var(--sans);margin-bottom:8px}
#app[dir=rtl] .fld label{font:500 14px var(--ar)}
.fld .opt{color:var(--muted);font-weight:400}
.in{width:100%;height:46px;border:1px solid var(--strong);border-radius:2px;background:var(--raised);color:var(--ink);padding:0 14px;font:400 15px var(--sans)}
#app[dir=rtl] .in{font:400 16px var(--ar)}
textarea.in{height:120px;padding:12px 14px;resize:vertical}
.in:focus{outline:2px solid var(--ink);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{height:40px;padding:0 14px;border:1px solid var(--line);font:500 14px var(--sans);color:var(--ink);background:var(--raised);transition:background .2s,color .2s,border-color .2s;font-variant-numeric:tabular-nums}
#app[dir=rtl] .chips button{font:500 15px var(--ar)}
.chips button:hover{border-color:var(--strong)}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{font:400 12px var(--sans);color:var(--muted);margin-top:8px}
#app[dir=rtl] .hint{font:400 13px var(--ar)}
.err{font:500 12px var(--sans);color:#9B2F1C;margin-top:6px}
:root[data-theme=dark] .err{color:#E8917C}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .err{color:#E8917C}}
.side{border:1px solid var(--line);background:var(--raised);padding:24px;display:grid;gap:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px)}
.side .val{font:500 15px var(--sans);user-select:all;direction:ltr;unicode-bidi:isolate}
.done{border:1px solid var(--line);background:var(--raised);padding:36px;animation:pageIn .5s var(--ease) both}
.done h2{margin-top:10px}
.sum{margin-top:24px;border-top:1px solid var(--line)}
.sum div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font:400 15px var(--sans)}
#app[dir=rtl] .sum div{font:400 16px var(--ar)}
.sum b{font-weight:500}
@media (max-width:980px){.teaser{grid-template-columns:56px 1fr 20px}.teaser .p,.teaser .ttime{grid-column:2/4}.teaser .go{grid-row:1;grid-column:3}.svc-top,.svc-det,.about,.book{grid-template-columns:1fr;gap:40px}.promise{grid-template-columns:1fr 1fr;row-gap:28px}.promise div:nth-child(3){border-inline-start:0;padding-inline-start:0}.bigstep{grid-template-columns:72px 1fr;gap:20px}.bigstep .p{grid-column:2}.side{position:static}.links a.on::after{display:none}}
@media (max-width:640px){.f2{grid-template-columns:1fr}.facts{grid-template-columns:1fr}.facts div{border-inline-start:0;padding-inline-start:0;border-top:1px solid var(--line)}.facts div:first-child{border-top:0}.promise{grid-template-columns:1fr}.promise div{border-inline-start:0;padding-inline-start:0}.portrait{aspect-ratio:4/3}}
/* expandable work rows */
.wrow{display:block;padding:0}
.whead{display:grid;grid-template-columns:64px minmax(180px,260px) 1fr 24px;gap:24px;align-items:center;width:100%;padding:22px 0;text-align:start}
.whead:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.wn{display:block}.wname,.wtag{display:block}
.whead .p{margin:0;font-size:16px}
.whead .tile{display:grid}
.pm{position:relative;width:16px;height:16px;justify-self:end;transition:transform .35s var(--ease)}
.pm::before,.pm::after{content:"";position:absolute;left:0;right:0;top:50%;height:1.5px;margin-top:-.75px;background:currentColor}
.pm::after{transform:rotate(90deg)}
.wrow:hover .go.pm,#app[dir=rtl] .wrow:hover .go.pm{transform:none;color:var(--ink)}
.wrow.open .go.pm{transform:rotate(45deg);color:var(--ink)}
.wrow.open::before{opacity:1}
.wrow.open .tile{background:var(--ink);border-color:var(--ink)}.wrow.open .tile .lg{color:var(--bg)}
.wdet{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.wrow.open .wdet{grid-template-rows:1fr}
.wclip{overflow:hidden;min-height:0}
.win2{padding:4px 0 34px;padding-inline-start:88px;opacity:0;transform:translateY(-6px);transition:opacity .35s,transform .45s var(--ease)}
.wrow.open .win2{opacity:1;transform:none;transition-delay:.08s}
.wcols{display:grid;grid-template-columns:1fr 1fr;gap:48px;border-top:1px solid var(--line);padding-top:24px}

function applyTheme(){
  const r = document.documentElement;
  if (theme === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', theme);
  const t = document.getElementById('themeBtn'); if (t) { t.innerHTML = isDark() ? sun : moon; t.setAttribute('aria-label', isDark() ? 'Light mode' : 'Dark mode'); }
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === theme)));

/* ---------- booking form ---------- */
function wireBook(){
  const f = X[lang].form; let slot = null;
  document.querySelectorAll('#slots button').forEach(b => b.onclick = () => { slot = b.dataset.s; document.querySelectorAll('#slots button').forEach(o => o.setAttribute('aria-pressed', String(o === b))); clearErr(document.getElementById('slots')); });
  const form = document.getElementById('bookForm');
  function setErr(el, msg){ clearErr(el); const e = document.createElement('div'); e.className = 'err'; e.textContent = msg; el.parentElement.appendChild(e); }
  function clearErr(el){ const e = el.parentElement.querySelector('.err'); if (e) e.remove(); }
  form.querySelectorAll('.in').forEach(i => i.addEventListener('input', () => clearErr(i)));
  form.onsubmit = ev => {
    ev.preventDefault(); let ok = true, first = null;
    const need = (id, msg) => { const el = document.getElementById(id); if (!el.value.trim()) { setErr(el, msg || f.req); ok = false; first = first || el; return false; } return true; };
    need('f-name'); if (need('f-email') && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(document.getElementById('f-email').value)) { setErr(document.getElementById('f-email'), f.email_bad); ok = false; first = first || document.getElementById('f-email'); }
    need('f-phone');
    const d = document.getElementById('f-date');
    if (need('f-date')) { const day = new Date(d.value + 'T12:00:00').getDay(); if (day === 5 || day === 6) { setErr(d, f.weekend); ok = false; first = first || d; } }
    if (!slot) { setErr(document.getElementById('slots'), f.pick); ok = false; first = first || document.getElementById('slots'); }
    need('f-msg');
    if (!ok) { first.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'center'}); if (first.focus) first.focus({preventScroll:true}); return; }
    const s = document.getElementById('f-service'), ty = document.getElementById('f-type');
    const dateTxt = new Date(d.value + 'T12:00:00').toLocaleDateString(lang === 'ar' ? 'ar-SA-u-nu-latn-ca-gregory' : 'en-GB', {weekday:'long', day:'numeric', month:'long'});
    document.getElementById('bookbox').innerHTML = `<div class="done"><span class="label"><i style="background:var(--up)"></i>${f.doneL}</span><h2>${f.doneH}</h2>
      <div class="sum"><div><span>${f.service}</span><b>${s.options[s.selectedIndex].text}</b></div><div><span>${f.type}</span><b>${ty.value}</b></div><div><span>${f.date}</span><b>${dateTxt}</b></div><div><span>${f.time}</span><b dir="ltr">${slot}</b></div></div>
      <p class="hint" style="margin-top:20px">${f.note}</p><button class="btn ghost" type="button" id="again" style="margin-top:12px">${f.again}</button></div>`;
    document.getElementById('again').onclick = () => render();
    window.scrollTo({top: 0, behavior: reduce ? 'auto' : 'smooth'});
  };
}

/* ---------- motion ---------- */
function countUp(el, delay){
  const target = el.dataset.count; const m = target.match(/[\d][\d,]*(\.\d+)?/);
  if (!m || reduce) return;
  const num = parseFloat(m[0].replace(/,/g,'')); const dec = m[1] ? m[1].length-1 : 0;
  const pre = target.slice(0, m.index), post = target.slice(m.index + m[0].length);
  const fmt = v => { const s = v.toFixed(dec); return m[0].includes(',') ? Number(s).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}) : s; };
  el.textContent = pre + fmt(0) + post; let start = null;
  setTimeout(() => requestAnimationFrame(function step(ts){ if (!start) start = ts; const p = Math.min(1,(ts-start)/1100), e = 1-Math.pow(1-p,3); el.textContent = pre + fmt(num*e) + post; if (p<1) requestAnimationFrame(step); else el.textContent = target; }), delay||0);
}
const anims = {
  mini(el){ el.querySelectorAll('[data-count]').forEach((c,i)=>countUp(c,150+i*90)); el.querySelectorAll('.mbars i').forEach((b,i)=>{ b.style.animation=`grow .9s var(--ease) ${.15+i*.07}s both`; }); },
  ticks(el){ el.querySelectorAll('.tick svg').forEach((s,i)=>{ s.style.transitionDelay=(.35+i*.25)+'s'; }); },
  meters(el){ el.querySelectorAll('.meter s').forEach(s=>{ const w=s.style.getPropertyValue('--w'); s.style.setProperty('--w',0); requestAnimationFrame(()=>requestAnimationFrame(()=>s.style.setProperty('--w',w))); }); el.querySelectorAll('[data-count]').forEach((c,i)=>countUp(c,100+i*120)); },
  brand(el){ el.classList.add('go'); },
  steps(el){ const pr = el.querySelector('.progress'); pr.style.setProperty('--p',0); requestAnimationFrame(()=>requestAnimationFrame(()=>pr.style.setProperty('--p',1))); el.querySelectorAll('.step').forEach((s,i)=>setTimeout(()=>s.classList.add('lit'),250+i*380)); }
};
function wire(){
  const hero = document.getElementById('hero-win');
  if (hero) { hero.querySelectorAll('.kpis [data-count]').forEach((el,i)=>countUp(el,700+i*110)); setTimeout(()=>hero.classList.add('live'),200); }
  document.querySelectorAll('.win.spot').forEach(w => w.addEventListener('pointermove', e => { const r = w.getBoundingClientRect(); w.style.setProperty('--mx',(e.clientX-r.left)+'px'); w.style.setProperty('--my',(e.clientY-r.top)+'px'); }));
  const items = [...document.querySelectorAll('[data-reveal]')];
  if (!reduce && 'IntersectionObserver' in window) {
    const io = new IntersectionObserver(es => es.forEach(en => { if (!en.isIntersecting) return; const el = en.target; io.unobserve(el); el.classList.add('revealed'); el.classList.remove('pending'); if (el.dataset.anim && anims[el.dataset.anim]) anims[el.dataset.anim](el); }), {threshold:.18, rootMargin:'0px 0px -6% 0px'});
    items.forEach(el => { if (el.getBoundingClientRect().top > innerHeight*.95) { el.classList.add('pending'); io.observe(el); } else if (el.dataset.anim && anims[el.dataset.anim]) anims[el.dataset.anim](el); });
  }
  onScroll();
}
function onScroll(){
  const nav = document.getElementById('nav'); if (nav) nav.classList.toggle('scrolled', scrollY > 8);
  const b = document.querySelector('.band'); if (!b || reduce) return;
  const r = b.getBoundingClientRect(); const p = Math.min(1, Math.max(0, (innerHeight - r.top) / (innerHeight + r.height)));
  const sp = b.querySelector('.spear'); const w = sp.getBoundingClientRect().width || 400;
  const startX = -w*.72, endX = Math.min(b.clientWidth*.42, b.clientWidth - w) - w*.1;
  sp.style.setProperty('--sx', (startX + (endX-startX)*p) + 'px');
}
addEventListener('scroll', onScroll, {passive:true});
addEventListener('resize', onScroll);
addEventListener('hashchange', () => { render(); if (!sessionScroll) window.scrollTo({top:0}); });
if (window.matchMedia) { const mq = matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', applyTheme); }
render();

</script>
